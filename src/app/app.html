<main>
  <h1>Gravity cluster</h1>

  <p class="status" aria-live="polite">
    @if (selectedId() === null) {
      Click a circle to select it.
    } @else {
      Clicked id: <strong>{{ selectedId() }}</strong>
    }
  </p>

  <section aria-labelledby="examples-heading">
    <h2 id="examples-heading">Concept examples</h2>
    <ul class="grid">
      @for (items of examples; track $index) {
        <li class="panel">
          <app-gravity-cluster [items]="items" (itemClick)="selectedId.set($event)" />
        </li>
      }
    </ul>
  </section>

  <section aria-labelledby="playground-heading">
    <h2 id="playground-heading">Playground</h2>
    <label for="count">Circles: {{ count() }}</label>
    <input id="count" type="range" min="0" max="30" [value]="count()" (input)="setCount($event)" />
    <button type="button" class="shuffle" (click)="reroll()">Shuffle random layouts</button>
    <div class="compare">
      <figure class="panel">
        <app-gravity-cluster [items]="playground()" (itemClick)="selectedId.set($event)" />
        <figcaption>Default (input order)</figcaption>
      </figure>
      <figure class="panel">
        <app-gravity-cluster
          [items]="playground()"
          [sorted]="true"
          (itemClick)="selectedId.set($event)"
        />
        <figcaption>sorted = true</figcaption>
      </figure>
      <figure class="panel">
        <app-gravity-cluster
          [items]="randomItems()"
          [randomize]="true"
          (itemClick)="selectedId.set($event)"
        />
        <figcaption>randomize = true</figcaption>
      </figure>
      <figure class="panel">
        <app-gravity-cluster
          [items]="randomItems()"
          [sorted]="true"
          [randomize]="true"
          (itemClick)="selectedId.set($event)"
        />
        <figcaption>sorted = true, randomize = true</figcaption>
      </figure>
    </div>
  </section>
</main>
